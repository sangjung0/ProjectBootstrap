[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "%%PROJECT_NAME%%"
version = "0.1.0"
description = "%%PROJECT_DESCRIPTION%%"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[project.scripts]
pill-preprocess = "%%PROJECT_NAME%%.main:main"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "notebook>=7.5.5",
]
test = [
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.9",
    "types-tqdm>=4.67.3.20260408",
]

[tool.mypy]
strict = true
mypy_path = [
    "src",
]
exclude = [
    "^tests/scripts/",
]
files = [
    "src/%%PROJECT_NAME%%",
]

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
exclude = [
]

[tool.ruff.lint]
select = [
    "E",  # All pycodestyle errors
    "F",  # All pyflakes errors
    "I",  # All isort errors
    "N",  # All naming convention errors
]

[tool.pytest.ini_options]
env_files=[".env"]
addopts = "--ignore=tests/unit --ignore=tests/scripts"
pythonpath = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["%%PROJECT_NAME%%*", "%%PROJECT_NAME%%.*"]
